[package]
name = "audio-interface"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Cross-platform audio device manager: pick default inputs/outputs, monitor levels, lock mic gain."
license = "MIT"
repository = "https://github.com/ikjbi/audioInterface"
readme = "README.md"
keywords = ["audio", "microphone", "bluetooth", "devices", "meter"]
categories = ["multimedia::audio", "gui", "command-line-utilities"]

[[bin]]
name = "audio-interface"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
ctrlc = "3.5.2"
directories = "6.0.0"
eframe = "0.37.0"
env_logger = "0.11.11"
global-hotkey = "0.9.0"
hound = "3.5.1"
jiff = "0.2.41"
log = "0.4.35"
notify-rust = "4.17.0"
png = "0.18"
rtrb = "0.4.1"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# cpal is used for audio capture (level meters). On Linux we use its PulseAudio
# host (pure Rust, also works on PipeWire via pipewire-pulse) so device IDs match
# the PulseAudio names used by our control backend.
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18.2"
tray-icon = "0.24.2"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
pulseaudio = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
] }
windows-core = "0.62"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
