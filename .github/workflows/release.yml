name: Release

# Push a tag like `v0.1.0` to build binaries for all three OSes and attach
# them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
          - name: macos-universal
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: v
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          # Bundle versions must be numeric: 0.1.0-alpha.1 -> 0.1.0
          echo "version=${v%%-*}" >> "$GITHUB_OUTPUT"
          # Full version (with any -alpha suffix) for file names, so downloads show which
          # release they are: audio-interface-0.1.2-windows-x86_64.zip
          echo "full=$v" >> "$GITHUB_OUTPUT"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          PKG=audio-interface-${{ steps.v.outputs.full }}-${{ matrix.name }}
          mkdir -p dist/$PKG
          cp target/release/audio-interface assets/icon.png packaging/linux/install-user.sh packaging/linux/audio-interface.desktop dist/$PKG/
          cp docs/INSTALL.md README.md LICENSE dist/$PKG/
          tar -C dist -czf dist/$PKG.tar.gz $PKG
          rm -rf dist/$PKG

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked
          mkdir -p dist/pkg
          cp target/release/audio-interface.exe "packaging/windows/Install shortcuts.cmd" packaging/windows/README.txt LICENSE dist/pkg/
          (cd dist/pkg && 7z a ../audio-interface-${{ steps.v.outputs.full }}-${{ matrix.name }}.zip .)
          rm -rf dist/pkg

      - name: Build (macOS universal .app)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/audio-interface \
            target/aarch64-apple-darwin/release/audio-interface \
            target/x86_64-apple-darwin/release/audio-interface
          bash scripts/bundle-macos.sh dist/audio-interface "${{ steps.v.outputs.version }}" dist
          (cd dist && ditto -c -k --keepParent "Audio Interface.app" audio-interface-${{ steps.v.outputs.full }}-${{ matrix.name }}.zip)
          rm -rf "dist/Audio Interface.app" dist/audio-interface

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Tags like v0.1.0-alpha.1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
