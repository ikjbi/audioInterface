name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

      - name: CLI smoke test (mock backend)
        shell: bash
        run: |
          set -euxo pipefail
          BIN=target/debug/audio-interface
          $BIN --version
          $BIN --mock list
          $BIN --mock list --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d)==6, d'
          $BIN --mock set-default input "usb mic"
          $BIN --mock volume output "LG" 30
          $BIN --mock meter --seconds 1

      - uses: actions/upload-artifact@v4
        with:
          name: audio-interface-${{ runner.os }}-debug
          path: |
            target/debug/audio-interface
            target/debug/audio-interface.exe
          if-no-files-found: ignore
          retention-days: 7

  # Exercise the real Linux backend against a real PulseAudio server with
  # virtual devices: a sine-wave source (a fake mic) and two null sinks.
  linux-pulseaudio:
    name: Linux PulseAudio integration
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev \
            libwayland-dev libx11-dev pulseaudio pulseaudio-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: Start PulseAudio with virtual devices
        run: |
          pulseaudio --start --exit-idle-time=-1 --log-target=stderr
          sleep 1
          pactl load-module module-null-sink sink_name=ci_speakers sink_properties=device.description=CI_Speakers
          pactl load-module module-null-sink sink_name=ci_headphones sink_properties=device.description=CI_Headphones
          pactl load-module module-sine-source source_name=ci_sine_mic rate=48000 frequency=440
          pactl info
      - name: Integration test
        run: bash scripts/ci-linux-pulse.sh target/debug/audio-interface

  # Exercise the real Windows/macOS backends. Windows runners have no sound card,
  # so a virtual one (VB-CABLE) is installed first. The smoke test changes volume,
  # mute and defaults on whatever devices exist, verifies each change through the
  # OS, and restores everything.
  real-devices:
    name: Real-device smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install a virtual sound card
        uses: LABSN/sound-ci-helpers@e9d6ba52163a3283714a68412036ddf33f78d49c
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: Device smoke test
        shell: bash
        run: python3 scripts/device-smoke.py target/debug/audio-interface ${{ runner.os == 'Windows' && '--require-devices' || '' }}
      - name: Allow microphone access for desktop apps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Hosted runners ship with "Let desktop apps access your microphone" off,
          # which makes WASAPI capture fail with E_ACCESSDENIED.
          foreach ($root in 'HKCU:', 'HKLM:') {
            $base = "$root\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
            New-Item -Path "$base\NonPackaged" -Force | Out-Null
            Set-ItemProperty -Path $base -Name Value -Value Allow
            Set-ItemProperty -Path "$base\NonPackaged" -Name Value -Value Allow
          }
      - name: Capture/meter smoke test
        shell: bash
        run: |
          set -x
          BIN=target/debug/audio-interface
          if $BIN list --json | python3 -c 'import json,sys; sys.exit(0 if any(d["direction"]=="input" for d in json.load(sys.stdin)) else 1)'; then
            # Opens a real capture stream on the default input. Fails only if no audio arrives at all.
            if [ "$RUNNER_OS" = "macOS" ]; then
              # Capture may be blocked by the microphone permission (TCC) on hosted runners.
              $BIN meter --seconds 3 | tr '\r' '\n' | grep summary || echo "::warning::macOS capture unavailable on this runner (microphone permission)"
            else
              $BIN meter --seconds 3 | tr '\r' '\n' | grep summary
            fi
          else
            echo "no input devices; skipping"
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Native output peak meter (IAudioMeterInformation)
            $BIN meter --direction output --seconds 2 | tr '\r' '\n' | grep summary
          fi

  # The install guide promises builds without admin rights. Prove both paths.
  windows-gnu:
    name: Windows build with GNU toolchain (no admin)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install the GNU toolchain (per-user, no Visual Studio)
        shell: bash
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          key: gnu
      - run: cargo build --release --locked
      - name: Smoke test
        shell: bash
        run: |
          target/release/audio-interface.exe --version
          target/release/audio-interface.exe --mock list

  linux-no-sudo:
    name: Linux build without sudo (as documented)
    runs-on: ubuntu-latest
    needs: build
    container: ubuntu:24.04
    steps:
      - name: Base system (what a typical desktop already has)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gcc libc6-dev pkg-config libasound2t64 sudo
          useradd -m builder
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Build as an unprivileged user, following docs/INSTALL.md
        run: |
          chown -R builder "$GITHUB_WORKSPACE/src"
          su builder -c 'set -eux
            cd ~
            ! sudo -n true 2>/dev/null   # really no sudo
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            mkdir -p ~/.local/alsa && cd ~/.local/alsa
            apt-get download libasound2-dev
            dpkg -x libasound2-dev_*.deb root
            cd -
            export PKG_CONFIG_PATH="$HOME/.local/alsa/root/usr/lib/x86_64-linux-gnu/pkgconfig"
            export PKG_CONFIG_SYSROOT_DIR=/
            mkdir -p ~/.local/alsa/lib && ln -sf /usr/lib/x86_64-linux-gnu/libasound.so.2 ~/.local/alsa/lib/libasound.so
            export RUSTFLAGS="-L $HOME/.local/alsa/lib"
            cd '"$GITHUB_WORKSPACE"'/src
            cargo build --release --locked
            ./target/release/audio-interface --mock list
            mkdir -p /tmp/pkg && cp target/release/audio-interface assets/icon.png packaging/linux/* /tmp/pkg/
            sh /tmp/pkg/install-user.sh
            test -x ~/.local/bin/audio-interface
            test -f ~/.local/share/applications/com.ikjbi.AudioInterface.desktop
            ~/.local/bin/audio-interface --version
            sh /tmp/pkg/install-user.sh --uninstall
            test ! -e ~/.local/bin/audio-interface'
